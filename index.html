<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro del Dolor - Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #0d9488; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

    <div id="app-container"></div>
    <div id="modals"></div>

    <script type="module">
        // 1. IMPORTAR FIREBASE
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, updateDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // TU CONFIGURACIÓN DE FIREBASE (Las claves que me pasaste)
        const firebaseConfig = {
            apiKey: "AIzaSyDP6H4i0CQWV0mzLW3wz2MKQ2BqB6cBde8",
            authDomain: "clinica-centro-del-dolor.firebaseapp.com",
            projectId: "clinica-centro-del-dolor",
            storageBucket: "clinica-centro-del-dolor.firebasestorage.app",
            messagingSenderId: "109898377168",
            appId: "1:109898377168:web:cd556565814b6b439c3bd5",
            measurementId: "G-WGDSQ7QJP2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Variables de estado
        let currentUser = null;
        let currentTab = 'citas';
        let patients = [];
        let packages = [];
        let collaborators = [];
        let citas = [];

        // 2. SISTEMA DE LOGIN
        window.initApp = function() {
            renderLogin();
        }

        function renderLogin() {
            const html = `
            <div class="min-h-screen flex items-center justify-center bg-teal-700 p-4">
                <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm text-center fade-in">
                    <img src="image_1027ac.jpg" alt="Centro del Dolor" class="h-32 mx-auto mb-6 object-contain rounded-full border p-2" onerror="this.src='https://cdn-icons-png.flaticon.com/512/2960/2960006.png'">
                    <h1 class="text-2xl font-bold text-teal-800 mb-2">Bienvenido</h1>
                    <p class="text-gray-500 mb-6 text-sm">Ingresa tu número celular para acceder</p>
                    
                    <input type="password" id="login-input" placeholder="Ej. 5512345678" class="w-full p-4 border border-gray-200 rounded-xl mb-4 text-center text-lg focus:outline-none focus:border-teal-500 bg-gray-50">
                    <button id="btn-login" onclick="login()" class="w-full bg-teal-600 text-white font-bold py-4 rounded-xl hover:bg-teal-700 transition shadow-md">
                        Ingresar al Portal
                    </button>
                    <p id="login-error" class="text-red-500 text-sm mt-3 hidden">Usuario no encontrado</p>
                </div>
            </div>`;
            document.getElementById('app-container').innerHTML = html;
            document.getElementById('login-input').addEventListener('keypress', function(e) { if(e.key === 'Enter') login(); });
        }

        window.login = async function() {
            const input = document.getElementById('login-input').value.trim();
            const btn = document.getElementById('btn-login');
            const err = document.getElementById('login-error');
            
            if(!input) return;
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Conectando...';
            err.classList.add('hidden');

            if (input === 'AdminCentro26!') {
                currentUser = { role: 'admin', name: 'Administrador' };
                loadData();
            } else {
                // Aquí iría la lógica para buscar al paciente o terapeuta en la base de datos
                err.innerText = "Modo paciente en desarrollo. Usa tu acceso Admin.";
                err.classList.remove('hidden');
                btn.innerHTML = 'Ingresar al Portal';
            }
        }

        // 3. CARGAR DATOS EN TIEMPO REAL (FIRESTORE)
        function loadData() {
            // Escuchar Pacientes
            onSnapshot(collection(db, "patients"), (snapshot) => {
                patients = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                if(currentUser && currentTab === 'pacientes') renderDashboard();
            });

            // Escuchar Paquetes
            onSnapshot(collection(db, "packages"), (snapshot) => {
                packages = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                if(currentUser && currentTab === 'paquetes') renderDashboard();
            });

            // Escuchar Colaboradores
            onSnapshot(collection(db, "collaborators"), (snapshot) => {
                collaborators = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                if(currentUser && currentTab === 'colaboradores') renderDashboard();
            });

            renderDashboard(); // Render inicial
        }

        // 4. INTERFAZ PRINCIPAL (ADMIN)
        function renderDashboard() {
            const html = `
            <div class="flex h-screen overflow-hidden">
                <!-- Menú Lateral -->
                <aside class="w-64 bg-teal-800 text-white flex flex-col">
                    <div class="p-6 text-center border-b border-teal-700">
                        <img src="image_1027ac.jpg" onerror="this.style.display='none'" class="h-16 mx-auto bg-white rounded-full p-1 mb-2">
                        <h2 class="font-bold text-lg">Centro del Dolor</h2>
                        <p class="text-teal-200 text-sm">Panel Admin</p>
                    </div>
                    <nav class="flex-1 p-4 space-y-2">
                        <button onclick="changeTab('citas')" class="w-full flex items-center p-3 rounded-lg hover:bg-teal-700 transition ${currentTab === 'citas' ? 'bg-teal-700 font-bold' : ''}">
                            <i class="fa-regular fa-calendar w-6"></i> Agenda
                        </button>
                        <button onclick="changeTab('pacientes')" class="w-full flex items-center p-3 rounded-lg hover:bg-teal-700 transition ${currentTab === 'pacientes' ? 'bg-teal-700 font-bold' : ''}">
                            <i class="fa-solid fa-users w-6"></i> Pacientes
                        </button>
                        <button onclick="changeTab('colaboradores')" class="w-full flex items-center p-3 rounded-lg hover:bg-teal-700 transition ${currentTab === 'colaboradores' ? 'bg-teal-700 font-bold' : ''}">
                            <i class="fa-solid fa-user-doctor w-6"></i> Colaboradores
                        </button>
                        <button onclick="changeTab('paquetes')" class="w-full flex items-center p-3 rounded-lg hover:bg-teal-700 transition ${currentTab === 'paquetes' ? 'bg-teal-700 font-bold' : ''}">
                            <i class="fa-solid fa-box-open w-6"></i> Paquetes
                        </button>
                    </nav>
                    <div class="p-4 border-t border-teal-700">
                        <button onclick="location.reload()" class="w-full flex items-center text-teal-200 hover:text-white p-2">
                            <i class="fa-solid fa-right-from-bracket w-6"></i> Salir
                        </button>
                    </div>
                </aside>

                <!-- Área de Contenido Principal -->
                <main class="flex-1 overflow-y-auto bg-gray-50 p-8" id="main-content">
                    ${getTabContent()}
                </main>
            </div>`;
            document.getElementById('app-container').innerHTML = html;
        }

        window.changeTab = function(tab) {
            currentTab = tab;
            renderDashboard();
        }

        function getTabContent() {
            switch(currentTab) {
                case 'citas': return renderCitas();
                case 'pacientes': return renderPacientes();
                case 'colaboradores': return renderColaboradores();
                case 'paquetes': return renderPaquetes();
                default: return renderCitas();
            }
        }

        // --- SECCIÓN PACIENTES ---
        function renderPacientes() {
            return `
            <div class="fade-in">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">Directorio de Pacientes</h2>
                    <button onclick="openAddPaciente()" class="bg-teal-600 text-white px-4 py-2 rounded-lg hover:bg-teal-700 font-semibold shadow">
                        <i class="fa-solid fa-plus mr-2"></i>Nuevo Paciente
                    </button>
                </div>
                <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 border-b">
                                <th class="p-4 font-semibold text-gray-600">Nombre</th>
                                <th class="p-4 font-semibold text-gray-600">Celular</th>
                                <th class="p-4 font-semibold text-gray-600">Diagnóstico</th>
                                <th class="p-4 font-semibold text-gray-600">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${patients.length === 0 ? `<tr><td colspan="4" class="p-8 text-center text-gray-400">No hay pacientes registrados</td></tr>` : ''}
                            ${patients.map(p => `
                                <tr class="border-b hover:bg-gray-50 transition">
                                    <td class="p-4 font-medium text-gray-800">${p.name}</td>
                                    <td class="p-4 text-gray-500">${p.phone}</td>
                                    <td class="p-4 text-gray-500">${p.diagnosis || '-'}</td>
                                    <td class="p-4">
                                        <button onclick="openExpediente('${p.id}')" class="bg-teal-100 text-teal-700 px-3 py-1 rounded text-sm hover:bg-teal-200 font-semibold transition">
                                            <i class="fa-solid fa-folder-open mr-1"></i> Expediente
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>`;
        }

        window.openAddPaciente = function() {
            const html = `
            <div id="add-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4 fade-in">
                <div class="bg-white rounded-2xl w-full max-w-md p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">Registrar Paciente</h2>
                    <div class="space-y-4">
                        <input type="text" id="new-pat-name" placeholder="Nombre completo" class="w-full p-3 border rounded-lg bg-gray-50 focus:outline-teal-500">
                        <input type="number" id="new-pat-phone" placeholder="Celular (Será su contraseña)" class="w-full p-3 border rounded-lg bg-gray-50 focus:outline-teal-500">
                        <div class="grid grid-cols-2 gap-4">
                            <input type="text" id="new-pat-age" placeholder="Edad" class="w-full p-3 border rounded-lg bg-gray-50 focus:outline-teal-500">
                            <input type="text" id="new-pat-diag" placeholder="Diagnóstico" class="w-full p-3 border rounded-lg bg-gray-50 focus:outline-teal-500">
                        </div>
                        <textarea id="new-pat-hist" placeholder="Antecedentes (Alergias, cirugías...)" class="w-full p-3 border rounded-lg bg-gray-50 focus:outline-teal-500 h-24"></textarea>
                        
                        <div class="flex justify-end gap-2 pt-2">
                            <button onclick="document.getElementById('add-modal').remove()" class="px-4 py-2 text-gray-500 hover:bg-gray-100 rounded-lg">Cancelar</button>
                            <button onclick="guardarPaciente()" class="px-4 py-2 bg-teal-600 text-white font-bold rounded-lg hover:bg-teal-700 shadow">Guardar</button>
                        </div>
                    </div>
                </div>
            </div>`;
            document.getElementById('modals').innerHTML = html;
        }

        window.guardarPaciente = async function() {
            const name = document.getElementById('new-pat-name').value.trim();
            const phone = document.getElementById('new-pat-phone').value.trim();
            const age = document.getElementById('new-pat-age').value.trim();
            const diag = document.getElementById('new-pat-diag').value.trim();
            const hist = document.getElementById('new-pat-hist').value.trim();
            
            if(!name || !phone) return alert("Nombre y celular obligatorios.");
            
            await setDoc(doc(db, "patients", phone), {
                name, phone, age, diagnosis: diag, history: hist,
                sessionsCompleted: 0, sessionsTotal: 1,
                registeredAt: new Date().toISOString()
            });
            document.getElementById('add-modal').remove();
        }

        window.openExpediente = function(id) {
            const p = patients.find(x => x.id === id);
            if(!p) return;
            const html = `
            <div id="exp-modal" class="fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4 fade-in">
                <div class="bg-white rounded-2xl w-full max-w-2xl overflow-hidden shadow-2xl">
                    <div class="bg-teal-700 p-6 text-white flex justify-between items-center">
                        <div>
                            <h2 class="text-2xl font-bold">${p.name}</h2>
                            <p class="text-teal-200"><i class="fa-solid fa-phone mr-1"></i> ${p.phone}</p>
                        </div>
                        <button onclick="document.getElementById('exp-modal').remove()" class="text-white hover:text-red-200 text-xl"><i class="fa-solid fa-times"></i></button>
                    </div>
                    <div class="p-6 space-y-6">
                        <div class="bg-blue-50 p-4 rounded-lg border border-blue-100">
                            <h3 class="font-bold text-blue-800 mb-3"><i class="fa-solid fa-notes-medical mr-2"></i>Datos Clínicos</h3>
                            <div class="grid grid-cols-2 gap-4">
                                <div><p class="text-xs text-blue-600 font-bold uppercase">Edad</p><p class="text-gray-700">${p.age || 'No especificada'}</p></div>
                                <div><p class="text-xs text-blue-600 font-bold uppercase">Diagnóstico</p><p class="text-gray-700">${p.diagnosis || 'No especificado'}</p></div>
                            </div>
                            <div class="mt-3"><p class="text-xs text-blue-600 font-bold uppercase">Antecedentes</p><p class="text-gray-700 text-sm">${p.history || 'Ninguno registrado'}</p></div>
                        </div>
                        <div class="text-center pb-2">
                            <button onclick="document.getElementById('exp-modal').remove()" class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg font-bold">Cerrar Expediente</button>
                        </div>
                    </div>
                </div>
            </div>`;
            document.getElementById('modals').innerHTML = html;
        }

        // --- SECCIÓN COLABORADORES (CON FOTO) ---
        function renderColaboradores() {
            return `
            <div class="fade-in">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">Equipo de Terapeutas</h2>
                    <button onclick="openAddColaborador()" class="bg-teal-600 text-white px-4 py-2 rounded-lg hover:bg-teal-700 font-semibold shadow">
                        <i class="fa-solid fa-user-plus mr-2"></i>Añadir Terapeuta
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${collaborators.length === 0 ? `<p class="col-span-full text-gray-400 text-center py-8">Aún no hay colaboradores registrados.</p>` : ''}
                    ${collaborators.map(c => `
                        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex flex-col items-center text-center transition hover:shadow-md">
                            <img src="${c.photo || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" alt="Foto" class="w-24 h-24 rounded-full object-cover mb-4 shadow-sm border-2 border-teal-100">
                            <h3 class="text-lg font-bold text-gray-800">${c.name}</h3>
                            <p class="text-teal-600 font-medium text-sm mb-2">${c.specialty}</p>
                            <p class="text-gray-500 text-xs mb-4"><i class="fa-solid fa-phone mr-1"></i> ${c.phone}</p>
                            <button onclick="eliminarDoc('collaborators', '${c.id}')" class="text-red-500 hover:text-red-700 text-sm font-semibold"><i class="fa-solid fa-trash mr-1"></i> Eliminar</button>
                        </div>
                    `).join('')}
                </div>
            </div>`;
        }

        window.openAddColaborador = function() {
            const html = `
            <div id="add-colab-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4 fade-in">
                <div class="bg-white rounded-2xl w-full max-w-md p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">Registrar Terapeuta</h2>
                    <div class="space-y-4 text-sm">
                        
                        <!-- Input para la foto -->
                        <div class="flex flex-col items-center justify-center border-2 border-dashed border-gray-300 rounded-lg p-4 bg-gray-50">
                            <i class="fa-solid fa-camera text-3xl text-gray-400 mb-2"></i>
                            <p class="text-gray-500 font-semibold mb-2">Sube una foto de perfil</p>
                            <input type="file" id="colab-photo" accept="image/*" class="text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100">
                        </div>

                        <input type="text" id="colab-name" placeholder="Nombre completo" class="w-full p-3 border rounded-lg focus:outline-teal-500">
                        <input type="number" id="colab-phone" placeholder="Celular (Su contraseña de acceso)" class="w-full p-3 border rounded-lg focus:outline-teal-500">
                        <input type="text" id="colab-specialty" placeholder="Especialidad (Ej. Fisioterapeuta)" class="w-full p-3 border rounded-lg focus:outline-teal-500">
                        
                        <div class="flex justify-end gap-2 pt-4">
                            <button onclick="document.getElementById('add-colab-modal').remove()" class="px-4 py-2 text-gray-500 hover:bg-gray-100 rounded-lg">Cancelar</button>
                            <button onclick="guardarColaborador()" class="px-4 py-2 bg-teal-600 text-white font-bold rounded-lg hover:bg-teal-700 shadow" id="btn-save-colab">Guardar</button>
                        </div>
                    </div>
                </div>
            </div>`;
            document.getElementById('modals').innerHTML = html;
        }

        window.guardarColaborador = async function() {
            const name = document.getElementById('colab-name').value.trim();
            const phone = document.getElementById('colab-phone').value.trim();
            const spec = document.getElementById('colab-specialty').value.trim();
            const fileInput = document.getElementById('colab-photo');
            const btn = document.getElementById('btn-save-colab');
            
            if(!name || !phone) return alert("Nombre y celular son obligatorios.");

            btn.innerText = "Guardando..."; btn.disabled = true;

            // Lógica para convertir la imagen a formato Base64 (Texto)
            let photoBase64 = "";
            if (fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onloadend = async function() {
                    photoBase64 = reader.result; // El texto de la imagen
                    await saveColabToDb(phone, name, spec, photoBase64);
                }
                reader.readAsDataURL(file);
            } else {
                await saveColabToDb(phone, name, spec, photoBase64);
            }
        }

        async function saveColabToDb(phone, name, spec, photoData) {
            await setDoc(doc(db, "collaborators", phone), {
                name: name,
                phone: phone,
                specialty: spec,
                photo: photoData, // Aquí se guarda la foto
                role: 'therapist'
            });
            document.getElementById('add-colab-modal').remove();
        }

        // --- SECCIÓN PAQUETES (CATÁLOGO REAL) ---
        function renderPaquetes() {
            return `
            <div class="fade-in">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">Catálogo de Paquetes</h2>
                    <button onclick="openAddPaquete()" class="bg-teal-600 text-white px-4 py-2 rounded-lg hover:bg-teal-700 font-semibold shadow">
                        <i class="fa-solid fa-plus mr-2"></i>Nuevo Paquete
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${packages.length === 0 ? `<p class="col-span-full text-gray-400 text-center py-8">No hay paquetes en el catálogo.</p>` : ''}
                    ${packages.map(p => `
                        <div class="bg-white rounded-xl shadow-sm border border-teal-100 overflow-hidden">
                            <div class="bg-teal-50 p-4 border-b border-teal-100 flex justify-between items-center">
                                <h3 class="font-bold text-teal-800">${p.name}</h3>
                                <span class="bg-teal-600 text-white text-xs px-2 py-1 rounded-full font-bold">${p.sessions} Sesiones</span>
                            </div>
                            <div class="p-4">
                                <p class="text-3xl font-bold text-gray-800 mb-4">$${p.price}</p>
                                <button onclick="eliminarDoc('packages', '${p.id}')" class="w-full bg-red-50 text-red-600 py-2 rounded-lg text-sm font-semibold hover:bg-red-100 transition">
                                    Eliminar Paquete
                                </button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            </div>`;
        }

        window.openAddPaquete = function() {
            const html = `
            <div id="add-pkg-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4 fade-in">
                <div class="bg-white rounded-2xl w-full max-w-sm p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">Crear Nuevo Paquete</h2>
                    <div class="space-y-4">
                        <input type="text" id="pkg-name" placeholder="Nombre (Ej. Paquete Básico)" class="w-full p-3 border rounded-lg focus:outline-teal-500">
                        <input type="number" id="pkg-sessions" placeholder="Cantidad de Sesiones (Ej. 5)" class="w-full p-3 border rounded-lg focus:outline-teal-500">
                        <input type="number" id="pkg-price" placeholder="Precio Total ($)" class="w-full p-3 border rounded-lg focus:outline-teal-500">
                        
                        <div class="flex justify-end gap-2 pt-2">
                            <button onclick="document.getElementById('add-pkg-modal').remove()" class="px-4 py-2 text-gray-500 hover:bg-gray-100 rounded-lg">Cancelar</button>
                            <button onclick="guardarPaquete()" class="px-4 py-2 bg-teal-600 text-white font-bold rounded-lg hover:bg-teal-700 shadow">Guardar</button>
                        </div>
                    </div>
                </div>
            </div>`;
            document.getElementById('modals').innerHTML = html;
        }

        window.guardarPaquete = async function() {
            const name = document.getElementById('pkg-name').value.trim();
            const sessions = document.getElementById('pkg-sessions').value.trim();
            const price = document.getElementById('pkg-price').value.trim();
            
            if(!name || !sessions || !price) return alert("Llena todos los campos.");
            
            // Generar un ID simple para el paquete
            const pkgId = "PKG-" + Math.floor(Math.random() * 10000);
            
            await setDoc(doc(db, "packages", pkgId), {
                name,
                sessions: parseInt(sessions),
                price: parseFloat(price)
            });
            document.getElementById('add-pkg-modal').remove();
        }

        // --- SECCIÓN CITAS (BÁSICA POR AHORA) ---
        function renderCitas() {
            return `
            <div class="fade-in">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Agenda de Citas</h2>
                <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100 text-center">
                    <i class="fa-regular fa-calendar-check text-5xl text-teal-200 mb-4"></i>
                    <p class="text-gray-500 mb-4">El calendario de citas se mostrará aquí próximamente.</p>
                </div>
            </div>`;
        }

        // Funciones Globales
        window.eliminarDoc = async function(coleccion, id) {
            if(confirm('¿Estás seguro de eliminar este registro?')) {
                await deleteDoc(doc(db, coleccion, id));
            }
        }

        // Iniciar
        initApp();
    </script>
</body>
</html>
